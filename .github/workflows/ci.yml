name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Cache plugins
        uses: actions/cache@v5
        with:
          path: ~/.local/share/nvim/site/pack
          key: pack-${{ hashFiles('**/nvim-pack-lock.json') }}
          restore-keys: pack-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          git \
          curl \
          unzip \
          build-essential \
          cmake

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

      - name: Verify config loads
        env:
          NVIM_SKIP_MASON: "1"
        run: |
          export XDG_CONFIG_HOME="$PWD/.ci"
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$PWD" "$XDG_CONFIG_HOME/nvim"

          set -o pipefail
          nvim --headless -c "qa" 2>&1 | tee nvim.log

          ! grep -E "E[0-9]{4}:|Error in |Error detected|stack traceback|Attempt to" nvim.log
