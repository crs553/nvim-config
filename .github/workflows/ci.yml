---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1.83.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error

      - name: Lint YAML workflows
        run: |
          python -m pip install --quiet yamllint==1.37.1
          yamllint .github/workflows

  style:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

      - name: Install LuaCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Lint Lua
        run: luacheck init.lua lua/ ftplugin/

      - name: Check for typos
        uses: crate-ci/typos@v1.52.0
        with:
          config: ./typos.toml

  neovim:
    needs: [lint-actions, style]
    runs-on: ubuntu-latest

    env:
      NVIM_SKIP_MASON: "1"

    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, nightly]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Cache plugins
        uses: actions/cache@v5
        with:
          path: ~/.local/share/nvim/site/pack
          key: >-
            nvim-plugins-${{ runner.os }}-${{ matrix.nvim-version }}-${{
            hashFiles('nvim-pack-lock.json') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            build-essential \
            cmake

      - name: Configure Neovim environment
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/nvim-config"
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"

          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"

      - name: Verify configuration loads
        run: |
          set -o pipefail

          nvim --headless \
            -c "lua dofile('tests/smoke.lua')" \
            -c "qa!" \
            2>&1 | tee nvim.log

          if grep -Eq \
            'E[0-9]{4}:|Error in |Error detected|stack traceback|Attempt to' \
            nvim.log; then
            echo "Neovim configuration reported errors"
            exit 1
          fi

      - name: Verify lockfile was not modified
        run: git diff --exit-code -- nvim-pack-lock.json
